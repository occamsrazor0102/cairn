name: Release

# Builds an unsigned BEET desktop bundle on Linux, macOS, and Windows when
# a `v*` tag is pushed (or via manual workflow dispatch). Each platform job
# builds the Python sidecar via PyInstaller, then runs `cargo tauri build`,
# then uploads its installers to a draft GitHub release.
#
# Signing is intentionally NOT performed here. Users will see Gatekeeper /
# SmartScreen warnings until signing is wired up — see docs/building.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            script: bash scripts/build_release.sh
            artifact_glob: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/rpm/*.rpm
          - os: macos-latest
            target: aarch64-apple-darwin
            script: bash scripts/build_release.sh
            artifact_glob: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            script: pwsh scripts/build_release.ps1
            artifact_glob: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps (with dist extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dist]"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tauri-cli (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build release bundle
        run: ${{ matrix.script }}

      - name: List bundle output (debug)
        if: always()
        shell: bash
        run: ls -la src-tauri/target/release/bundle/ || true

      - name: Upload artifacts to draft release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          generate_release_notes: true
          files: ${{ matrix.artifact_glob }}

      - name: Upload artifacts (workflow_dispatch fallback)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: beet-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn

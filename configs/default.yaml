# configs/default.yaml
_profile: default

runtime:
  auto_route: false   # opt-in. When true, the pipeline auto-picks
                      # the calibrated profile via cairn/auto_routing.py
                      # instead of using the explicitly-loaded profile.

detectors:
  preamble:
    enabled: true
    weight: 1.0
  fingerprint_vocab:
    enabled: true
    weight: 0.8
  prompt_structure:
    enabled: true
    weight: 0.85
  voice_spec:
    enabled: true
    weight: 0.80
  instruction_density:
    enabled: true
    weight: 0.75
  nssi:
    enabled: true
    weight: 0.70
  surprisal_dynamics:
    enabled: true
    weight: 0.85
  contrastive_lm:
    enabled: true
    weight: 0.90
  perturbation:
    enabled: false
    weight: 0.80
  token_cohesiveness:
    enabled: true
    weight: 0.75
  contrastive_gen:
    enabled: false
    weight: 0.95
    provider: "anthropic"
    model: "claude-sonnet-4-6"
    n_baselines: 3
  dna_gpt:
    enabled: false
    weight: 0.85
    provider: "anthropic"
    model: "claude-haiku-4-5-20251001"
  mixed_boundary:
    enabled: true
    weight: 0.80
  cross_similarity:
    enabled: false
    weight: 0.70
  contributor_graph:
    enabled: false
    weight: 0.60

cascade:
  phase1_short_circuit_high: 0.85
  phase1_short_circuit_low: 0.10
  phase2_short_circuit_high: 0.80
  phase2_short_circuit_low: 0.15
  phase3_always_run: false

fusion:
  # Path to a trained EBM model (produced by scripts/train_fusion.py).
  # When null or missing, the pipeline falls back to naive fusion.
  model_path: null
  # Path to conformal calibration JSON (produced by scripts/calibrate_conformal.py).
  # When null or missing, prediction sets use the naive uncertainty heuristic.
  conformal_path: null
  # Path to per-detector isotonic calibration JSON (scripts/calibrate_detectors.py).
  detector_calibration_path: null

decision:
  red_threshold: 0.75
  amber_threshold: 0.50
  yellow_threshold: 0.25
  abstention:
    enabled: true
    max_prediction_set_size: 3
    label: "UNCERTAIN"
    action: "route_to_human_review"
  mixed:
    enabled: true
    min_mixed_probability: 0.60

privacy:
  raw_text_retention_days: 90
  access_logging: true
  contributor_anonymization_days: 365
  external_api:
    mode: "restricted"
    allowed_providers:
      - "anthropic"
    log_all_api_calls: true

router:
  minimum_words:
    prompt: 30
    prose: 150
    mixed: 300

gui:
  history:
    enabled: true
    db_path: data/cairn_history.sqlite3
    # Default to hash-only (text is NOT persisted in the queryable log).
    # Set retain_text: true to store the submission text alongside the
    # hash. Opt-in because the history DB lives on local disk with no
    # auth; retained text would include anything a reviewer has pasted.
    retain_text: false
  drift:
    enabled: true
    store_path: data/drift_alerts
    # Persistent observation window. When null (default), DriftMonitor uses
    # an in-memory list and the in-flight window is lost on sidecar restart.
    # Set to a path (e.g. data/drift_observations.sqlite3) to back the
    # window with sqlite so it survives restart.
    db_path: null

# ---------------------------------------------------------------------------
# Production hardening — auth + rate limiting
# ---------------------------------------------------------------------------
# CAIRN binds to loopback by default (127.0.0.1). When operators expose
# `cairn serve` or `cairn gui` past loopback, enable bearer-token auth
# AND rate limiting. Both default to disabled so the local-dev experience
# does not regress.

auth:
  # Master switch. When false (default) every request is allowed.
  # When true, every request must carry `Authorization: Bearer <token>`
  # matching one of the tokens below or the CAIRN_API_TOKEN env var.
  enabled: false
  # List of accepted bearer tokens. Populate via `auth.tokens` in a
  # production override profile, or rely on CAIRN_API_TOKEN env var.
  # Tokens are merged from both sources (env + config), de-duplicated.
  tokens: []
  # Header name to read the bearer credential from. Rarely overridden;
  # left here for proxies that rewrite the canonical name.
  header_name: Authorization

rate_limit:
  # Master switch. When false (default) the limiter is bypassed entirely
  # — zero overhead. When true, a sliding-window limiter is applied per
  # token (when authed) or per client IP (otherwise).
  enabled: false
  window_seconds: 60
  max_per_window: 60
  # `memory` keeps counters in process RAM (lost on restart, fine for a
  # single-process deployment). `sqlite` persists the events table to
  # disk and is safe across worker restarts. Override at runtime via
  # the CAIRN_RATE_LIMIT_STORE env var.
  store: memory
  # When true, hash limiter keys via SHA-256 before storing. Useful if
  # the sqlite store is shared and you want to keep raw IPs out of disk.
  hash_keys: false

# ---------------------------------------------------------------------------
# Tamper-evident audit chain
# ---------------------------------------------------------------------------
# When enabled, every CairnPipeline.analyze() best-effort appends one record
# to a hash-chained JSONL log. Each entry stores submission_id, text_hash
# (sha256, never the raw text), profile, p_llm, determination,
# calibration_status, model_artifact_hash, and a timestamp, plus the prior
# entry's hash so any tampering invalidates everything downstream.
# Verify with `cairn audit verify`. Default is OFF — local dev does not
# accumulate an audit log unless the operator opts in.
audit:
  enabled: false
  log_path: data/audit/chain.jsonl

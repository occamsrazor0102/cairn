_profile: calibrated_regen
_extends: default
_description: >
  Calibrated against a regenerated HC3 corpus — same questions as
  HC3 all, but with the LLM-side answers freshly generated by current
  models (Claude Sonnet 4.6 + an OpenAI saved Prompt template). The
  human side stays HC3's real human answers.

  Use this profile when you want a calibrated detector that reflects
  modern LLM output patterns rather than early-2023 ChatGPT.

  See docs/byo_dataset.md (Path 4) to retrain on a different model
  mix or your own corpus.

fusion:
  model_path: models/fusion/regen_mixed_ebm.pkl
  conformal_path: models/conformal/regen_mixed.json
  detector_calibration_path: models/calibrators/regen_mixed.json
